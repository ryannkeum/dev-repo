# Maps IAM role to namespaces by label selector
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: team-beta-role-selector
  namespace: ack-system          # Created in the ACK system namespace
spec:
  arn: arn:aws:iam::962765735148:role/ACK-TeamA-Role
  namespaceSelector:
    matchLabels:
      team: team-beta            # Apply this role to namespaces with this label
---
# After IAMRoleSelector is configured — no annotation required
apiVersion: dynamodb.services.k8s.aws/v1alpha1
kind: Table
metadata:
  name: team-beta-users-table
  namespace: team-beta         # team=team-beta label → ack-rds-role auto-applied
spec:
  tableName: users
  billingMode: PAY_PER_REQUEST
  attributeDefinitions:
    - attributeName: userID
      attributeType: S
    - attributeName: email
      attributeType: S
  keySchema:
    - attributeName: userID
      keyType: HASH
  globalSecondaryIndexes:
    - indexName: email-index
      keySchema:
        - attributeName: email
          keyType: HASH
      projection:
        projectionType: ALL
  tags:
    - key: environment
      value: production
    - key: team
      value: beta
